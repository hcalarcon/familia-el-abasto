# Configuración de Pages CMS (https://pagescms.org).
# El cliente entra con su cuenta de GitHub en https://app.pagescms.org,
# elige este repositorio y edita estos archivos desde un panel simple.
# Cada "Guardar" hace un commit y Cloudflare Pages publica solo.
#
# Los datos que todavía faltan van entre corchetes, por ejemplo
# "[Dirección de Luisa del Abasto]". Mientras estén así no se muestran en la web.

media:
  input: public/fotos
  output: /fotos
  categories: [image]

content:
  - name: paginas
    label: Páginas
    type: collection
    path: src/contenido/paginas
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [titulo, enMenu, borrador]
      primary: titulo
      sort: [orden, titulo]
      default:
        sort: orden
        order: asc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: descripcion
        label: Descripción para Google
        type: text
        required: true
        description: Una o dos oraciones. Es lo que aparece debajo del título en Google.
        options:
          maxlength: 200
      - name: imagen
        label: Foto principal (opcional)
        type: image
      - name: imagenAlt
        label: Descripción de la foto
        type: string
        description: Qué se ve en la foto, para quien no la puede ver y para Google. Ej. "Salón de El Abasto con mesas de madera".
      - name: enMenu
        label: Mostrar en el menú de arriba
        type: boolean
        default: false
      - name: orden
        label: Orden en el menú
        type: number
        default: 10
        description: Los números más chicos van primero.
      - name: borrador
        label: Borrador (no se publica)
        type: boolean
        default: false
      - name: body
        label: Contenido
        type: rich-text
        options:
          format: markdown

  - name: blog
    label: Blog
    type: collection
    path: src/contenido/blog
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [titulo, fecha, borrador]
      primary: titulo
      sort: [fecha, titulo]
      default:
        sort: fecha
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: descripcion
        label: Resumen para Google y la lista del blog
        type: text
        required: true
        options:
          maxlength: 200
      - name: fecha
        label: Fecha
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: imagen
        label: Foto principal (opcional)
        type: image
      - name: imagenAlt
        label: Descripción de la foto
        type: string
      - name: borrador
        label: Borrador (no se publica)
        type: boolean
        default: false
      - name: body
        label: Contenido
        type: rich-text
        options:
          format: markdown

  - name: sitio
    label: Datos del grupo y los locales
    type: file
    path: src/contenido/sitio.json
    format: json
    fields:
      - name: nombre
        label: Nombre del grupo
        type: string
        required: true
      - name: ciudad
        label: Ciudad
        type: string
        required: true
      - name: dominio
        label: Dominio de la web
        type: string
        description: Sólo de referencia. Por ejemplo elabasto.com.ar
      - name: lema
        label: Frase debajo del nombre
        type: string
      - name: firma
        label: Frase a mano (dorada)
        type: string
      - name: logo
        label: Logo (blanco, fondo transparente)
        type: image
      - name: logoAlt
        label: Descripción del logo
        type: string
      - name: historia
        label: Nuestra historia (texto corto)
        type: text
        required: true
      - name: locales
        label: Locales
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nombre}"
        fields:
          - name: nombre
            label: Nombre del local
            type: string
            required: true
          - name: nombreCorto
            label: Nombre corto (botones de redes)
            type: string
          - name: linea
            label: Línea de la tarjeta
            type: string
            description: Se ve debajo del nombre. Ej. "Av. San Martín 1234 · a metros de la Plaza Sarmiento"
          - name: descripcion
            label: Descripción para Google
            type: string
          - name: foto
            label: Foto de la tarjeta
            type: image
          - name: fotoAlt
            label: Descripción de la foto
            type: string
            description: Qué se ve en la foto. Ej. "Salón con la barra y el pizarrón"
          - name: logo
            label: Logo redondo (opcional)
            type: image
          - name: logoAlt
            label: Descripción del logo
            type: string
          - name: textoMenu
            label: Texto del botón del menú
            type: string
            description: Ej. "Ver menú" o "Ver carta"
            default: Ver menú
          - name: direccion
            label: Dirección
            type: string
            description: Calle y número, ciudad. Ej. "Av. San Martín 1234, San Martín de los Andes". Se ve en el chip de ubicación.
          - name: mapa
            label: Link de Google Maps (opcional)
            type: string
            description: En Google Maps, "Compartir" → "Copiar vínculo". Si queda vacío, el chip busca el local por nombre y dirección.
          - name: telefono
            label: Teléfono
            type: string
            description: Como se tiene que ver, por ejemplo (02972) 42-1454. El link para llamar se arma solo.
          - name: horario
            label: Horario
            type: string
          - name: menu
            label: Link al menú
            type: string
            description: Dirección completa, empezando con https://
          - name: zapan
            label: Link para pedir en Zapan
            type: string
            description: El link de Zapan de este local, empezando con https://. Si queda vacío, el segundo botón es "Reservar" y llama al teléfono.
          - name: instagram
            label: Instagram
            type: string
            description: Dirección completa, empezando con https://
          - name: facebook
            label: Facebook
            type: string
            description: Dirección completa, empezando con https://

  - name: cartas
    label: Textos de /cartas (la página del QR)
    type: file
    path: src/contenido/cartas.json
    format: json
    fields:
      - name: tituloRedes
        label: Título de las redes
        type: string
      - name: tituloLocales
        label: Título sobre los locales
        type: string
      - name: historiaTitulo
        label: Título del botón de historia
        type: string
      - name: historiaBajada
        label: Texto chico del botón de historia
        type: string
      - name: historiaLink
        label: Link del botón de historia
        type: string
        description: Una página del sitio, ej. /nuestra-historia. Si la página no existe, el botón no se muestra.
      - name: webTitulo
        label: Título del botón de la web
        type: string
      - name: webBajada
        label: Texto chico del botón de la web
        type: string
      - name: webLink
        label: Link del botón de la web
        type: string
        description: La página principal del sitio, ej. /. Si queda vacío, el botón no se muestra.

  - name: en-construccion
    label: Página "en construcción" (/)
    type: file
    path: src/contenido/en-construccion.json
    format: json
    fields:
      - name: aviso
        label: Aviso debajo del nombre
        type: string
        description: Si queda vacío no se muestra.
      - name: botonCartas
        label: Texto del botón a las cartas
        type: string
        description: Ej. "Ver las cartas". Si queda vacío, se usa "Ver las cartas" (el botón siempre está, para no dejar a nadie sin salida).
      - name: linkCartas
        label: Link del botón a las cartas
        type: string
        description: Conviene dejarlo en /cartas, que es la página del QR. Si queda vacío, lleva a /cartas.

  - name: carta-barricas
    label: Carta de Las Barricas
    type: file
    path: src/contenido/carta-barricas.json
    format: json
    fields:
      - name: categorias
        label: Categorías
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nombre}"
        fields:
          - name: nombre
            label: Nombre de la categoría
            type: string
            required: true
          - name: nota
            label: Nota (opcional)
            type: string
          - name: grupos
            label: Grupos de platos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titulo}"
            fields:
              - name: titulo
                label: Título del grupo (opcional)
                type: string
              - name: platos
                label: Platos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{nombre}"
                fields:
                  - name: nombre
                    label: Plato
                    type: string
                    required: true
                  - name: descripcion
                    label: Descripción (opcional)
                    type: text
                  - name: precio
                    label: Precio
                    type: string
                    description: Por ejemplo $ 12.500. Si queda vacío se muestra "Consultar".
